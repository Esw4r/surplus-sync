name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'mobile-ngo/**'
      - 'mobile-volunteer/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'mobile-ngo/**'
      - 'mobile-volunteer/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch: {}

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - mobile
          - mobile-ngo
          - mobile-volunteer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install pub dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ matrix.app }}
        run: flutter test --no-pub --coverage

      # Optionally build APK/IPA if you want to produce artifacts
      - name: Build APK
        if: matrix.app == 'mobile' # only build for main app for now
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-coverage
          path: ${{ matrix.app }}/coverage
