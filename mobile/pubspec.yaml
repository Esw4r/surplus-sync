name: food_rescue_app
description: Unified Food Rescue Mobile App - Donor & Volunteer
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Network & API
  dio: ^5.4.0
  http: ^1.1.2
  socket_io_client: ^2.0.3
  web_socket_channel: ^2.4.0

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Location & Maps
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^2.0.1
  geocoding: ^2.1.1

  # QR Code Scanning
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0

  # Image Handling
  image_picker: ^1.0.5

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  flutter_spinkit: ^5.2.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
